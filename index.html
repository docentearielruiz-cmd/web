<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Entorno Didáctico - Ejercicios de Programación</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="header">
    <h1 id="exercise-title">Título del ejercicio</h1>
    <p id="exercise-desc">Descripción breve del ejercicio aparecerá aquí.</p>
  </header>

  <main class="main">
    <section class="entradas">
      <h2>Entradas</h2>
      <div id="inputs-container">
        <!-- Aquí se crearán dinámicamente las cajas de texto / controles -->
      </div>

      <div class="botones">
        <button onclick="runExercise()">Ejecutar</button>
        <button onclick="iniciarNuevamente()">Iniciar</button>
      </div>
    </section>

    <aside class="salida">
      <h2>Respuesta</h2>
      <div id="resultado" class="resultado-box"></div>
    </aside>
  </main>

  <footer class="footer">
    <small>Entorno didáctico — Proyecto Web Básico</small>
  </footer>

  <script src="assets/js/script.js"></script>
</body>
</html>
